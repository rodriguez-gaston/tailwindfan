<section class="relative flex justify-center w-full h-full px-5 py-20 sm:justify-end">
  <div class="absolute inset-0 bg-blue-500">
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d444456.131812888!2d-58.48215294656642!3d-34.57864720128116!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sar!4v1666210434011!5m2!1ses!2sar" width="100%" height="100%" style="filter: grayscale(1) opacity(0.6);" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div class="relative p-5 bg-white shadow-xl w-72 rounded-xl">
    <h2 class="font-bold text-gray-600">Contact us!</h2>
    <p class="text-sm text-gray-600">Leave us your information and we'll contact you shortly</p>
    <form class="mt-5 space-y-5">
      <input type="text" id="name" name="name" placeholder="Name" class="w-full p-2 text-base text-gray-700 transition-colors duration-300 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none placeholder:text-gray-400 focus:border-sky-500">
      <input type="email" id="email" name="email" placeholder="Email" class="w-full p-2 text-base text-gray-700 transition-colors duration-300 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none placeholder:text-gray-400 focus:border-sky-500">
      <input type="text" id="message" name="message" placeholder="Message" class="w-full p-2 text-base text-gray-700 transition-colors duration-300 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none placeholder:text-gray-400 focus:border-sky-500">
      <button type="submit" class="flex items-center justify-center w-full gap-2 py-2 text-white rounded bg-sky-500 hover:bg-sky-700">
        Send
      </button>
    </form>
  </div>
</section>
