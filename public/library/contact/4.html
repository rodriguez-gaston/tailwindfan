<section class="relative w-full h-full px-5 py-20 flex justify-center sm:justify-end">
  <div class="absolute inset-0 bg-blue-500">
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d444456.131812888!2d-58.48215294656642!3d-34.57864720128116!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sar!4v1666210434011!5m2!1ses!2sar" width="100%" height="100%" style="filter: grayscale(1) opacity(0.6);" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div class="bg-white p-5 relative w-72 rounded-xl shadow-xl">
    <h2 class="font-bold text-gray-600">Contact us!</h2>
    <p class="text-sm text-gray-600">Leave us your information and we'll contact you shortly</p>
    <form class="mt-5 space-y-5">
      <input type="text" id="name" name="name" placeholder="Name" class="placeholder:text-gray-400 w-full border border-gray-300 focus:border-sky-500 text-base outline-none text-gray-700 rounded bg-gray-100 p-2 transition-colors duration-300 ease-in-out">
      <input type="email" id="email" name="email" placeholder="Email" class="placeholder:text-gray-400 w-full border border-gray-300 focus:border-sky-500 text-base outline-none text-gray-700 rounded bg-gray-100 p-2 transition-colors duration-300 ease-in-out">
      <input type="text" id="message" name="message" placeholder="Message" class="placeholder:text-gray-400 w-full border border-gray-300 focus:border-sky-500 text-base outline-none text-gray-700 rounded bg-gray-100 p-2 transition-colors duration-300 ease-in-out">
      <button type="submit" class="bg-sky-500 hover:bg-sky-700 py-2 w-full rounded text-white flex gap-2 justify-center items-center">
        Send
      </button>
    </form>
  </div>
</section>
