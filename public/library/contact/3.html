<form class="w-full max-w-lg space-y-10">
  <input type="text" id="name" name="name" placeholder="Name" class="w-full px-2 py-1 text-base text-gray-700 transition-colors duration-300 ease-in-out border-t-0 border-b border-l-0 border-r-0 border-gray-300 outline-none placeholder:text-gray-400 focus:ring-0 focus:border-sky-500">
  <input type="email" id="email" name="email" placeholder="Email" class="w-full px-2 py-1 text-base text-gray-700 transition-colors duration-300 ease-in-out border-t-0 border-b border-l-0 border-r-0 border-gray-300 outline-none placeholder:text-gray-400 focus:ring-0 focus:border-sky-500">
  <input type="text" id="message" name="message" placeholder="Message" class="w-full px-2 py-1 text-base text-gray-700 transition-colors duration-300 ease-in-out border-t-0 border-b border-l-0 border-r-0 border-gray-300 outline-none placeholder:text-gray-400 focus:ring-0 focus:border-sky-500">
  <div>
    <input type="file" name="file" id="file" class="hidden">
    <label for="file" class="inline-flex gap-2 text-gray-400 cursor-pointer hover:text-gray-700">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M15 7l-6.5 6.5a1.5 1.5 0 0 0 3 3l6.5 -6.5a3 3 0 0 0 -6 -6l-6.5 6.5a4.5 4.5 0 0 0 9 9l6.5 -6.5" />
      </svg>
      Attach files
    </label>
  </div>
  <button type="submit" class="flex items-center justify-center gap-2 px-5 py-2 text-white bg-sky-500 hover:bg-sky-700">
    Send
  </button>
</form>
