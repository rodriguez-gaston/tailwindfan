<section class="flex flex-col items-center w-full">
  <h1 class="text-lg font-semibold">Contact us</h1>
  <form class="grid grid-cols-2 gap-4 mt-2">
    <div class="relative col-span-2 sm:col-span-1">
      <label for="name" class="text-sm leading-7 text-gray-600">Name</label>
      <input type="text" id="name" name="name" class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200">
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="email" class="text-sm leading-7 text-gray-600">Email</label>
      <input type="email" id="email" name="email" class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200">
    </div>
    <div class="relative col-span-2">
      <label for="message" class="text-sm leading-7 text-gray-600">Message</label>
      <textarea id="message" name="message" class="w-full h-32 px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 border border-gray-300 rounded outline-none resize-none focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200"></textarea>
    </div>
    <div class="flex col-span-2 gap-4">
      <button type="submit" class="flex items-center justify-center w-full gap-2 p-3 text-white rounded bg-sky-500 hover:bg-sky-700">
        Send
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <line x1="10" y1="14" x2="21" y2="3" />
            <path d="M21 3l-6.5 18a0.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a0.55 .55 0 0 1 0 -1l18 -6.5" />
          </svg>
        </span>
      </button>
    </div>
  </form>
</section>
