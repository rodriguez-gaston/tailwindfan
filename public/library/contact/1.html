<section class="w-full flex flex-col items-center">
  <h1 class="text-lg font-semibold">Contact us</h1>
  <form class="grid grid-cols-2 gap-4 mt-2">
    <div class="col-span-2 sm:col-span-1 relative">
      <label for="name" class="leading-7 text-sm text-gray-600">Name</label>
      <input type="text" id="name" name="name" class="w-full bg-gray-100 rounded border border-gray-300 focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
    </div>
    <div class="col-span-2 sm:col-span-1 relative">
      <label for="email" class="leading-7 text-sm text-gray-600">Email</label>
      <input type="email" id="email" name="email" class="w-full bg-gray-100 rounded border border-gray-300 focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
    </div>
    <div class="col-span-2 relative">
      <label for="message" class="leading-7 text-sm text-gray-600">Message</label>
      <textarea id="message" name="message" class="h-32 resize-none w-full bg-gray-100 rounded border border-gray-300 focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"></textarea>
    </div>
    <div class="col-span-2 flex gap-4">
      <button type="submit" class="bg-sky-500 hover:bg-sky-700 p-3 rounded text-white w-full flex gap-2 justify-center items-center">
        Send
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <line x1="10" y1="14" x2="21" y2="3" />
            <path d="M21 3l-6.5 18a0.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a0.55 .55 0 0 1 0 -1l18 -6.5" />
          </svg>
        </span>
      </button>
    </div>
  </form>
</section>
