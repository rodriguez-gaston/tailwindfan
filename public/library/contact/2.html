<section class="flex flex-col items-start w-full max-w-xl">
  <h1 class="mx-auto text-4xl sm:mx-0">Get in touch with us 👋</h1>
  <form class="grid grid-cols-2 gap-4 mx-auto mt-4 sm:mx-0">
    <div class="relative col-span-2 sm:col-span-1">
      <label for="name" class="text-sm font-semibold leading-7 text-gray-600">Name</label>
      <input placeholder="John Doe" type="text" id="name" name="name" class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 bg-opacity-50 border-none outline-none placeholder:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-gray-700" />
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="email" class="text-sm font-semibold leading-7 text-gray-600">Email</label>
      <input placeholder="example@mail.com" type="email" id="email" name="email" class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 bg-opacity-50 border-none outline-none placeholder:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-gray-700" />
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="service" class="text-sm font-semibold leading-7 text-gray-600">Service</label>
      <select class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 bg-opacity-50 border-none outline-none placeholder:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-gray-700" type="text" id="service">
        <option>UX / UI</option>
        <option>Web Development</option>
        <option>Mobile Development</option>
        <option>Testing & QA</option>
      </select>
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="email" class="text-sm font-semibold leading-7 text-gray-600">Budget</label>
      <select class="w-full px-3 py-1 text-base leading-8 text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 bg-opacity-50 border-none outline-none placeholder:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-gray-700" type="text" id="service">
        <option disabled selected value>Select an option</option>
        <option>$0 to $5,000</option>
        <option>$5,000 to $10,000</option>
        <option>$10,000 to $50,000</option>
        <option>More than $50,000</option>
      </select>
    </div>
    <div class="relative col-span-2">
      <label for="message" class="text-sm font-semibold leading-7 text-gray-600">Message</label>
      <textarea placeholder="Tell us about your project" id="message" name="message" class="w-full h-32 px-3 py-1 text-base text-gray-700 transition-colors duration-200 ease-in-out bg-gray-100 bg-opacity-50 border-none outline-none resize-none placeholder:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-gray-700"></textarea>
    </div>
    <div class="flex col-span-1 gap-4">
      <button type="submit" class="flex items-center justify-center w-full gap-2 p-3 text-sm text-white bg-black">
        Send
      </button>
    </div>
  </form>
</section>
