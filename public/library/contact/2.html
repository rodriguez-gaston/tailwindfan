<section class="flex max-w-xl w-full flex-col items-start">
  <h1 class="text-4xl mx-auto sm:mx-0">Get in touch with us 👋</h1>
  <form class="mt-4 grid grid-cols-2 gap-4 mx-auto sm:mx-0">
    <div class="relative col-span-2 sm:col-span-1">
      <label for="name" class="text-sm leading-7 font-semibold text-gray-600">Name</label>
      <input placeholder="John Doe" type="text" id="name" name="name" class="placeholder:text-sm placeholder:text-gray-400 w-full border-none bg-gray-100 bg-opacity-50 py-1 px-3 text-base leading-8 text-gray-700 outline-none transition-colors duration-200 ease-in-out focus:ring-1 focus:ring-gray-700" />
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="email" class="text-sm leading-7 font-semibold text-gray-600">Email</label>
      <input placeholder="example@mail.com" type="email" id="email" name="email" class="placeholder:text-sm placeholder:text-gray-400 w-full border-none bg-gray-100 bg-opacity-50 py-1 px-3 text-base leading-8 text-gray-700 outline-none transition-colors duration-200 ease-in-out focus:ring-1 focus:ring-gray-700" />
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="service" class="text-sm leading-7 font-semibold text-gray-600">Service</label>
      <select class="placeholder:text-sm placeholder:text-gray-400 w-full border-none bg-gray-100 bg-opacity-50 py-1 px-3 text-base leading-8 text-gray-700 outline-none transition-colors duration-200 ease-in-out focus:ring-1 focus:ring-gray-700" type="text" id="service">
        <option>UX / UI</option>
        <option>Web Development</option>
        <option>Mobile Development</option>
        <option>Testing & QA</option>
      </select>
    </div>
    <div class="relative col-span-2 sm:col-span-1">
      <label for="email" class="text-sm leading-7 font-semibold text-gray-600">Budget</label>
      <select class="placeholder:text-sm placeholder:text-gray-400 w-full border-none bg-gray-100 bg-opacity-50 py-1 px-3 text-base leading-8 text-gray-700 outline-none transition-colors duration-200 ease-in-out focus:ring-1 focus:ring-gray-700" type="text" id="service">
        <option disabled selected value>Select an option</option>
        <option>$0 to $5,000</option>
        <option>$5,000 to $10,000</option>
        <option>$10,000 to $50,000</option>
        <option>More than $50,000</option>
      </select>
    </div>
    <div class="relative col-span-2">
      <label for="message" class="text-sm leading-7 font-semibold text-gray-600">Message</label>
      <textarea placeholder="Tell us about your project" id="message" name="message" class="placeholder:text-sm placeholder:text-gray-400 h-32 w-full resize-none border-none bg-gray-100 bg-opacity-50 py-1 px-3 text-base text-gray-700 outline-none transition-colors duration-200 ease-in-out focus:ring-1 focus:ring-gray-700"></textarea>
    </div>
    <div class="col-span-1 flex gap-4">
      <button type="submit" class="flex w-full items-center justify-center gap-2 bg-black p-3 text-white text-sm">
        Send
      </button>
    </div>
  </form>
</section>
