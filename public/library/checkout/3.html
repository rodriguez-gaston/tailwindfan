<div class="grid items-start grid-cols-1 gap-4 md:grid-cols-2 md:gap-2">
  <div class="flex flex-col items-center justify-start col-span-1 p-4 bg-white border border-gray-300 rounded-xl">
    <section class="w-full">
      <h1 class="text-lg font-semibold">Payment information</h1>
      <form class="grid grid-cols-4 gap-4 mt-4">
        <div class="flex col-span-4 gap-4">
          <div class="relative">
            <input type="radio" name="payment" id="payment1" class="hidden peer">
            <label for="payment1" class="flex items-center justify-center p-2 text-sm text-gray-600 transition border border-gray-200 rounded-lg cursor-pointer peer-checked:bg-gray-200">
              <p class="inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <rect x="3" y="5" width="18" height="14" rx="3" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                  <line x1="7" y1="15" x2="7.01" y2="15" />
                  <line x1="11" y1="15" x2="13" y2="15" />
                </svg>
              </p>
            </label>
          </div>
          <div class="relative">
            <input type="radio" name="payment" id="payment2" class="hidden peer">
            <label for="payment2" class="flex items-center justify-center p-2 text-sm text-gray-600 transition border border-gray-200 rounded-lg cursor-pointer peer-checked:bg-gray-200">
              <p class="inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M10 13l2.5 0c2.5 0 5 -2.5 5 -5c0 -3 -1.9 -5 -5 -5h-5.5c-.5 0 -1 .5 -1 1l-2 14c0 .5 .5 1 1 1h2.8l1.2 -5c.1 -.6 .4 -1 1 -1zm7.5 -5.8c1.7 1 2.5 2.8 2.5 4.8c0 2.5 -2.5 4.5 -5 4.5h-2.6l-.6 3.6a1 1 0 0 1 -1 .8l-2.7 0a0.5 .5 0 0 1 -.5 -.6l.2 -1.4" />
                </svg>
              </p>
            </label>
          </div>
          <div class="relative">
            <input type="radio" name="payment" id="payment3" class="hidden peer">
            <label for="payment3" class="flex items-center justify-center p-2 text-sm text-gray-600 transition border border-gray-200 rounded-lg cursor-pointer peer-checked:bg-gray-200">
              <p class="inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M6 6h8a3 3 0 0 1 0 6a3 3 0 0 1 0 6h-8" />
                  <line x1="8" y1="6" x2="8" y2="18" />
                  <line x1="8" y1="12" x2="14" y2="12" />
                  <line x1="9" y1="3" x2="9" y2="6" />
                  <line x1="13" y1="3" x2="13" y2="6" />
                  <line x1="9" y1="18" x2="9" y2="21" />
                  <line x1="13" y1="18" x2="13" y2="21" />
                </svg>
              </p>
            </label>
          </div>
        </div>
        <div class="col-span-4">
          <label class="block mb-1 text-sm font-semibold text-gray-600" for="name">Name on card</label>
          <input class="w-full p-2 text-sm placeholder-gray-400 border-gray-200 rounded-lg focus:ring-0 focus:border-blue-500" type="text" id="name" placeholder="John Doe" />
        </div>
        <div class="col-span-4 md:col-span-2">
          <label class="block mb-1 text-sm font-semibold text-gray-600" for="card">Card number</label>
          <input class="w-full p-2 text-sm placeholder-gray-400 border-gray-200 rounded-lg focus:ring-0 focus:border-blue-500" type="text" id="card" placeholder="1234 1234 1234 1234" />
        </div>
        <div class="hidden col-span-2 md:block"></div>
        <div class="col-span-2 md:col-span-1">
          <label class="block mb-1 text-sm font-semibold text-gray-600" for="cvv">CVV</label>
          <input class="w-full p-2 text-sm placeholder-gray-400 border-gray-200 rounded-lg focus:ring-0 focus:border-blue-500" type="password" id="cvv" placeholder="123" />
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="block mb-1 text-sm font-semibold text-gray-600" for="expires">Expires</label>
          <input class="w-full p-2 text-sm placeholder-gray-400 border-gray-200 rounded-lg focus:ring-0 focus:border-blue-500" type="text" id="expires" placeholder="MM/YYYY" />
        </div>
        <div class="flex col-span-4 gap-4">
          <button class="px-6 py-3 text-sm border border-black rounded-lg">Back</button>
          <button type="submit" class="w-full p-3 text-sm text-white bg-black rounded-lg">Complete payment - <span class="font-semibold">$180.00</span></button>
        </div>
      </form>
    </section>
  </div>
  <div class="col-span-1 p-4 bg-white border border-gray-300 rounded-xl">
    <p class="text-lg font-bold">Order summary</p>
    <div class="flex-col justify-start mt-2 space-y-4">
      <section class="flex items-center justify-between gap-2 text-gray-500">
        <div class="flex gap-2">
          <p>x1</p>
          <h4 class="font-bold">Nike Zoom</h4>
        </div>
        <div class="flex items-center gap-2">
          <p class="font-bold">$70.00</p>
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
              <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
              <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            </svg>
          </button>
        </div>
      </section>
      <section class="flex items-center justify-between gap-2 text-gray-500">
        <div class="flex gap-2">
          <p>x2</p>
          <h4 class="font-bold">Nike Air</h4>
        </div>
        <div class="flex items-center gap-2">
          <p class="font-bold">$110.00</p>
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
              <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
              <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            </svg>
          </button>
        </div>
      </section>
      <div class="w-full h-px bg-gray-300"></div>
      <div class="items-center justify-between hidden text-lg font-bold text-center text-gray-800 md:flex">
        <p>Order total</p>
        <p>$180.00</p>
      </div>
    </div>
    <form class="grid items-end grid-cols-4 gap-4 mt-4">
      <div class="col-span-3">
        <label class="block mb-1 text-sm font-semibold text-gray-600" for="coupon">Coupon code</label>
        <input class="w-full p-2 text-sm placeholder-gray-400 border-gray-200 rounded-lg focus:ring-0 focus:border-blue-500" type="text" id="coupon" placeholder="ABC123" />
      </div>
      <div class="flex col-span-1 gap-4">
        <button type="submit" class="w-full p-2 text-sm border border-black rounded-lg">Apply</button>
      </div>
    </form>
  </div>
</div>
